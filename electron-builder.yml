# Desktop installers for Jeo Stone Studio (Windows + macOS).
#   pnpm desktop:win   → release/Jeo Stone Studio Setup <version>.exe
#   pnpm desktop:mac   → release/Jeo Stone Studio-<version>-<arch>.dmg (run on a Mac / GitHub Actions)
appId: com.jeostonestudio.app
productName: Jeo Stone Studio
copyright: Copyright © Jeo Stone Studio
electronVersion: 45.2.2

directories:
  # Only the tiny Electron shell is packaged as the app; the server is added below.
  app: desktop/app
  buildResources: desktop/resources
  output: release

files:
  - main.cjs
  - package.json
  # SHA-256 of resources/server.asar, written by desktop/before-pack.cjs.
  - server-integrity.json
  # The shell needs no npm packages; never bundle the website's dependencies.
  - "!**/node_modules/**"

# Nothing to install or rebuild for the shell.
npmRebuild: false
nodeGypRebuild: false

# The self-contained Node server from `pnpm run build` (dist/standalone) is
# sealed into one archive with its node_modules (desktop/before-pack.cjs) and
# shipped as resources/server.asar. main.cjs checks its hash before starting it.
beforePack: desktop/before-pack.cjs
# (A folder copied to ".", so electron-builder records the archive in the
# executable's integrity list as resources/server.asar: with the integrity
# fuse on, Electron refuses to open any archive that is not listed.)
extraResources:
  - from: desktop/.pack/resources
    to: .

# Lock the Electron binary down (written into the executable itself):
# no running it as plain Node, no NODE_OPTIONS / --inspect to inject code or
# attach a debugger, and app.asar is checked against a hash stored in the
# executable at every start, so edited app files stop the app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch: [x64]
  icon: icon.png
  artifactName: "Jeo Stone Studio Setup ${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jeo Stone Studio

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: icon.png
  artifactName: "Jeo Stone Studio-${version}-${arch}.${ext}"

dmg:
  title: Jeo Stone Studio

publish: null
