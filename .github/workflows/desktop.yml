# Builds the desktop installers on GitHub's machines:
#   Windows → Prela Stone Studio Setup <version>.exe
#   macOS   → Prela Stone Studio-<version>-arm64.dmg (Apple Silicon)
#             Prela Stone Studio-<version>-x64.dmg   (Intel)
#
# Run it from GitHub → Actions → "Desktop installers" → Run workflow, then
# download the files under "Artifacts". Pushing a tag like v1.0.1 also
# attaches the installers to a GitHub Release.
#
# The apps are unsigned: Windows shows "Windows protected your PC"
# (More info → Run anyway) and macOS needs right-click → Open the first time.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the studio server
        run: pnpm run build

      - name: Package installer
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet; build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: Prela-Stone-Studio-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
