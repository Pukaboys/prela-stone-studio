# Builds the desktop installers on GitHub's machines:
#   Windows → Prela Stone Studio Setup <version>.exe
#   macOS   → Prela Stone Studio-<version>-arm64.dmg (Apple Silicon)
#             Prela Stone Studio-<version>-x64.dmg   (Intel)
#
# Run it from GitHub → Actions → "Desktop installers" → Run workflow, then
# download the files under "Artifacts". Pushing a tag like v1.0.1 also
# attaches the installers to a GitHub Release.
#
# Unsigned unless signing secrets are set (see "Package installer" below):
# Windows then shows "Windows protected your PC" (More info → Run anyway)
# and macOS needs right-click → Open the first time.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the studio server
        run: pnpm run build

      - name: Version from tag
        # Local builds stay 1.0.0; a release tag like v1.0.3 sets the app version,
        # which the in-app update check compares against.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Package installer
        shell: bash
        run: |
          ARGS="${{ matrix.target }} --publish never"
          # Notarize on macOS only when Apple credentials are configured.
          if [ "${{ runner.os }}" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then ARGS="$ARGS -c.mac.notarize=true"; fi
          pnpm exec electron-builder $ARGS
        env:
          # Code signing (optional). Add these repository secrets to sign:
          #   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
          #   macOS:   MAC_CSC_LINK (base64 .p12 Developer ID), MAC_CSC_KEY_PASSWORD,
          #            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without certificates, build unsigned installers instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK) && 'true' || 'false' }}

      - uses: actions/upload-artifact@v4
        with:
          name: Prela-Stone-Studio-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
